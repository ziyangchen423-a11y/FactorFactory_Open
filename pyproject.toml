[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "factorfactory-open"
version = "0.1.0"
description = "FactorFactory Open - 因子工厂开源版 - Local A-share quantitative research core library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "FactorFactory Open Contributors" }
]
keywords = ["quantitative", "finance", "a-share", "factor-engine", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas",
    "numpy",
    "tushare",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
fundfactory = "fundfactory_core.cli.main:main"

[project.urls]
Homepage = "https://github.com/ziyangchen423-a11y/FactorFactory_Open"
Documentation = "https://github.com/ziyangchen423-a11y/FactorFactory_Open#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["fundfactory_core*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
